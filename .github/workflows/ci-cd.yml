name: MLOps CI/CD Pipeline

# Every push / PR: lint, unit tests, Docker build (no registry push).
# Manual "Run workflow": additionally runs the SageMaker Pipeline DAG
# (Preprocess -> Train -> Evaluate -> WAPE quality gate -> Register | Fail)
# and fails this workflow when the quality gate fails.

on:
  push:
    branches: [ main, ved-development, ved-development-2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      max_test_wape:
        description: 'Quality gate: maximum test WAPE (default 0.70; e.g. 0.50 to demo a failing gate)'
        required: false
        default: '0.70'
      min_wape_improvement:
        description: 'Quality gate: minimum WAPE improvement vs seasonal-naive (default 0.10)'
        required: false
        default: '0.10'

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.10'

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Unit tests
      run: pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.xml

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: retail-inventory-forecasting:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  sagemaker-pipeline:
    name: SageMaker Pipeline (train, evaluate, gate, register)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4

    - name: Check AWS credentials are configured
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      run: |
        missing=""
        for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ROLE_ARN; do
          [ -z "${!name}" ] && missing="$missing $name"
        done
        if [ -n "$missing" ]; then
          echo "::error::Missing repository secrets:$missing (AWS_SESSION_TOKEN is also required for Learner Lab credentials)"
          exit 1
        fi

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline and wait for the quality gate
      env:
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        SAGEMAKER_SUPPRESS_V2_WARNING: '1'
      run: |
        python -m src.aws.sagemaker.pipeline run --wait \
          --max-wape "${{ inputs.max_test_wape }}" \
          --min-improvement "${{ inputs.min_wape_improvement }}" \
          --display-name "github-${{ github.run_number }}"
